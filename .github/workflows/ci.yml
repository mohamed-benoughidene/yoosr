name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # Quality gates — runs on all PRs and pushes to main/develop.
  # Vercel handles frontend deployments natively via its GitHub
  # integration, so this job only validates code quality.
  # ============================================================
  quality-gates:
    name: Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Setup Bun and install
        uses: ./.github/actions/setup-bun

      - name: Run linter
        run: bun run lint

      - name: Run tests
        run: bun run test

      - name: Build Next.js
        run: bun run build

  # ============================================================
  # Convex staging — deployed when develop receives a push.
  # Uses the staging Convex deploy key.
  # Vercel auto-deploys the frontend to a Preview URL.
  # ============================================================
  deploy-convex-develop:
    name: Deploy Convex (develop)
    needs: quality-gates
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    timeout-minutes: 10

    steps:
      - name: Setup Bun and install
        uses: ./.github/actions/setup-bun

      - name: Deploy Convex to Staging
        run: npx convex deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_STAGING }}

  # ============================================================
  # Convex production — deployed when main receives a push.
  # Uses the production Convex deploy key.
  # Vercel auto-deploys the frontend to Production.
  # ============================================================
  deploy-convex-prod:
    name: Deploy Convex (main)
    needs: quality-gates
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 10

    steps:
      - name: Setup Bun and install
        uses: ./.github/actions/setup-bun

      - name: Deploy Convex to Production
        run: npx convex deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_PROD }}
